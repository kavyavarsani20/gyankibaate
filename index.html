

<!DOCTYPE html>
<html lang="gu">
<head>
    <meta charset="UTF-8">
    <title>Jay Swaminarayan! | Gyankibaate</title>
    <style>
        :root { --primary: #e67e22; --dark: #2c3e50; --bg: #fdfefe; }
        body { font-family: 'Segoe UI', sans-serif; background: var(--bg); margin: 0; padding: 20px; line-height: 1.8; }
        .header { text-align: center; color: var(--primary); font-size: 2.2rem; font-weight: bold; margin-bottom: 20px; border-bottom: 4px solid var(--primary); padding-bottom: 10px; }
        .container { max-width: 900px; margin: auto; background: white; padding: 40px; border-radius: 30px; box-shadow: 0 20px 60px rgba(0,0,0,0.1); }
        .streak-info { text-align: center; color: #e67e22; background: #fff3e0; padding: 15px; border-radius: 15px; font-weight: bold; margin-bottom: 30px; }
        .article { border-bottom: 2px solid #eee; padding: 30px 0; }
        .category { background: var(--dark); color: white; padding: 5px 15px; border-radius: 5px; font-size: 0.8rem; text-transform: uppercase; font-weight: bold; }
        h2 { color: var(--dark); margin: 20px 0; font-size: 1.8rem; }
        .detail-text { font-size: 1.2rem; color: #444; text-align: justify; }
        .guj-box { display: none; background: #f0f7ff; padding: 25px; border-radius: 15px; margin-top: 20px; border-left: 10px solid #3498db; font-size: 1.35rem; color: #1a237e; }
        .btn-translate { background: var(--primary); color: white; border: none; width: 100%; padding: 20px; border-radius: 15px; font-size: 1.2rem; font-weight: bold; cursor: pointer; margin-bottom: 30px; transition: 0.3s; }
        .quiz-section { background: #e8f5e9; padding: 30px; border-radius: 20px; border: 3px dashed #27ae60; margin-top: 40px; display: none; }
    </style>
</head>
<body>

<div class="header">Jay Swaminarayan!</div>

<div class="container">
    <div class="streak-info">🔥 Hello Kavya! | Today is: <span id="currentDate"></span> | Streak: <span id="streakCount">0</span> Days</div>
    
    <button class="btn-translate" onclick="toggleLanguage()">Read Detailed Gujarati / ગુજરાતીમાં વિગતવાર વાંચો</button>

    <div id="yesterdayQuiz" class="quiz-section">
        <span class="category">Memory Quiz</span>
        <h3>Yesterday's Brain Test</h3>
        <p id="qText"></p>
        <button onclick="document.getElementById('aText').style.display='block'" style="background:#27ae60; color:white; border:none; padding:10px 20px; border-radius:5px; cursor:pointer;">Show Detailed Answer</button>
        <p id="aText" style="display:none; margin-top:15px; font-weight:bold; color:#27ae60;"></p>
    </div>

    <div id="contentArea">
        <p style="text-align: center;">Opening the Great Library... Please wait.</p>
    </div>
</div>

<script>
    function toggleLanguage() {
        const boxes = document.querySelectorAll('.guj-box');
        const isHidden = boxes[0].style.display === 'none' || boxes[0].style.display === '';
        boxes.forEach(b => b.style.display = isHidden ? 'block' : 'none');
    }

    async function startEngine() {
        const today = new Date();
        document.getElementById('currentDate').innerText = today.toDateString();
        
        // STREAK LOGIC
        let streak = parseInt(localStorage.getItem('gyan_streak')) || 0;
        let last = localStorage.getItem('gyan_last');
        if(last !== today.toDateString()) {
            streak++;
            localStorage.setItem('gyan_streak', streak);
            localStorage.setItem('gyan_last', today.toDateString());
        }
        document.getElementById('streakCount').innerText = streak;

        // THE 365-DAY LIBRARY (Rotation based on day of year)
        const dayOfYear = Math.floor((today - new Date(today.getFullYear(), 0, 0)) / 86400000);
        
        const library = [
            {
                cat: "Electronics & Science (ECE)",
                title: "The Deep Logic of the Diode: Why it Matters",
                eng: `Imagine a busy street where cars are only allowed to move in one direction. If a car tries to come back, a giant steel wall blocks it. In the world of electronics, this 'one-way street' is a <b>Diode</b>. <br><br>
                      <b>The Science:</b> A diode is made by joining P-type and N-type materials (materials that have 'holes' or 'extra electrons'). When you apply voltage in the right direction (Forward Bias), the electrons jump across the gap and the current flows. But if you reverse the wires, the gap becomes huge, like a wide river, and no electricity can jump across. <br><br>
                      <b>Child Logic (10-year-old):</b> Think of a diode like a water valve in your house. It lets water go to the tap, but it never lets dirty water flow back into the main pipes. It is a guard. <br><br>
                      <b>Why for you:</b> As an ECE student, you must know that without diodes, your phone charger would catch fire. Your wall socket gives AC (Alternating Current - which goes back and forth), but your phone battery only drinks DC (Direct Current - which flows one way). The diode stands at the entrance and forces the messy AC to become clean, one-way DC.`,
                guj: `<b>ડાયોડનું ઊંડું વિજ્ઞાન:</b> વિચારો કે વીજળી એ એક એવી ગલી છે જ્યાં વાહનોને માત્ર એક જ દિશામાં જવાની છૂટ છે. જો કોઈ વાહન પાછું આવવાનો પ્રયત્ન કરે, તો મોટી દીવાલ તેને રોકી દે છે. ઈલેક્ટ્રોનિક્સમાં આને 'ડાયોડ' કહેવાય છે. <br><br>
                      <b>૧૦ વર્ષના બાળકની સમજૂતી:</b> ડાયોડને તમારા ઘરના પાણીના વાલ્વ જેવો માનો. તે પાણીને નળ સુધી જવા દે છે, પણ ગંદા પાણીને પાઈપમાં પાછું જવા દેતું નથી. તે એક ચોકીદાર છે. <br><br>
                      <b>તમારા માટે મહત્વ:</b> ડાયોડ વગર તમારા ફોનનું ચાર્જર સળગી જાય! સ્વીચબોર્ડમાંથી આવતી વીજળી આગળ-પાછળ વહે છે (AC), પણ બેટરીને સીધી વહેતી વીજળી (DC) જોઈએ છે. ડાયોડ આ વીજળીને બેટરી માટે તૈયાર કરે છે.`
            },
            {
                cat: "Global Politics & Market",
                title: "The Shift of Global Power: Who Leads the World?",
                eng: `For many years, the world was 'Unipolar' (યુનિપોલર - meaning only one country, like the USA, was the leader). But now, we are moving to a 'Multipolar' (મલ્ટીપોલર) world. <br><br>
                      <b>What is happening?</b> Think of a classroom where only one student decides which games to play. Now, 4 or 5 students (like India, China, Europe) are all deciding together. This is a massive shift in 'Diplomacy' (ડિપ્લોમસી - the art of countries making friends). <br><br>
                      <b>The Market Impact:</b> Because power is shifting, countries are fighting over 'Semiconductors' (સેમિકન્ડક્ટર - the chips inside phones). Since everything from cars to missiles needs these chips, the country that makes the best chips becomes the most powerful. This is why ECE students are the most important people in this new world!`,
                guj: `<b>વૈશ્વિક શક્તિમાં ફેરફાર:</b> ઘણા વર્ષોથી દુનિયામાં માત્ર એક જ દેશ (જેમ કે અમેરિકા) નેતા હતો. પણ હવે ભારત અને ચીન જેવા દેશો પણ શક્તિશાળી બની રહ્યા છે. આને 'મલ્ટીપોલર' દુનિયા કહેવાય છે. <br><br>
                      <b>બજાર પર અસર:</b> અત્યારે બધા દેશો 'સેમિકન્ડક્ટર' (ફોનની અંદરની ચિપ્સ) બનાવવા માટે લડી રહ્યા છે. જે દેશ પાસે આ ટેકનોલોજી હશે, તે દુનિયાનો નવો નેતા બનશે. આથી જ તમારા જેવા ઈલેક્ટ્રોનિક્સ એન્જિનિયરોની દુનિયામાં સૌથી વધુ જરૂર છે.`
            }
        ];

        // Rotation Logic
        const item = library[dayOfYear % library.length];
        
        // Display Today's Fact
        document.getElementById('contentArea').innerHTML = `
            <div class="article">
                <span class="category">${item.cat}</span>
                <h2>${item.title}</h2>
                <div class="detail-text">${item.eng}</div>
                <div class="guj-box">${item.guj}</div>
            </div>`;

        // Save for Tomorrow's Quiz
        const lastFact = localStorage.getItem('prev_fact');
        if(lastFact && last !== today.toDateString()) {
            document.getElementById('yesterdayQuiz').style.display = 'block';
            document.getElementById('qText').innerText = "Yesterday, we discussed the deep logic of: " + lastFact;
            document.getElementById('aText').innerText = "The correct category was: " + localStorage.getItem('prev_cat');
        }
        localStorage.setItem('prev_fact', item.title);
        localStorage.setItem('prev_cat', item.cat);
    }

    startEngine();
</script>
</body>
</html>
