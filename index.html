

<!DOCTYPE html>
<html lang="gu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jay Swaminarayan! | Gyankibaate</title>
    <style>
        :root { --primary: #e67e22; --dark: #2c3e50; --success: #27ae60; --bg: #f4f7f6; }
        body { font-family: 'Segoe UI', Arial, sans-serif; background: var(--bg); margin: 0; padding: 15px; line-height: 1.6; color: #333; }
        .header { text-align: center; color: var(--primary); font-size: 1.8rem; font-weight: bold; margin: 15px 0; }
        .container { max-width: 650px; margin: auto; background: white; padding: 25px; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); border-top: 10px solid var(--primary); }
        .streak-box { background: #fff3e0; padding: 12px; border-radius: 50px; text-align: center; font-weight: bold; color: #e65100; margin-bottom: 20px; border: 1px solid #ffe0b2; }
        .card { background: #fff; border: 1px solid #eee; border-left: 8px solid var(--dark); padding: 20px; margin-bottom: 20px; border-radius: 12px; }
        .quiz-card { background: #e8f5e9; border-left: 8px solid var(--success); padding: 20px; margin-bottom: 20px; border-radius: 12px; display: none; }
        .category { font-size: 0.8rem; font-weight: bold; color: var(--primary); text-transform: uppercase; display: block; margin-bottom: 8px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .guj-text { font-size: 1.3rem; color: #1a237e; display: none; margin-top: 12px; background: #f0f7ff; padding: 15px; border-radius: 8px; line-height: 1.5; }
        .btn { background: var(--dark); color: white; border: none; width: 100%; padding: 16px; border-radius: 12px; cursor: pointer; font-weight: bold; font-size: 1.1rem; margin-bottom: 15px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        .login-screen { position: fixed; inset: 0; background: var(--dark); color: white; display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 1000; }
        input { padding: 15px; border-radius: 10px; border: none; margin: 20px; width: 280px; font-size: 1.1rem; text-align: center; }
        .loading { text-align: center; padding: 40px; font-style: italic; color: #888; }
    </style>
</head>
<body>

<div id="login" class="login-screen" style="display:none;">
    <h1>Jay Swaminarayan!</h1>
    <p>તમારું નામ લખો (Enter Your Name):</p>
    <input type="text" id="userName" placeholder="Name / નામ">
    <button class="btn" onclick="saveUser()" style="width: 220px; background: var(--primary);">શરૂ કરો / START</button>
</div>

<div class="header">Jay Swaminarayan!</div>

<div class="container" id="mainApp">
    <div class="streak-box">✨ Hello <span id="dispName"></span>! | 🔥 Streak: <span id="streakCount">0</span> Days</div>
    
    <button class="btn" onclick="toggleLanguage()" id="langBtn">Translate to Gujarati / ગુજરાતી</button>

    <div id="yesterdayQuiz" class="quiz-card">
        <span class="category">🧠 Yesterday's Test (ગઈકાલનું રિવિઝન)</span>
        <p id="quizQuestion" style="font-weight:bold;">Loading memory...</p>
        <button class="btn" style="background:var(--success); padding: 10px;" onclick="document.getElementById('quizAnswer').style.display='block'">Show Answer</button>
        <p id="quizAnswer" style="display:none; font-weight:bold; color:var(--success); margin-top:10px;"></p>
    </div>

    <div id="dailyContent">
        <div class="loading">Fetching Today's Wisdom... Please wait.</div>
    </div>
</div>

<script>
    // 1. LOGIN & STREAK LOGIC
    function saveUser() {
        const name = document.getElementById('userName').value;
        if(name) {
            localStorage.setItem('gyan_user', name);
            location.reload();
        }
    }

    // 2. THE KNOWLEDGE ENGINE (365 DAYS)
    async function fetchKnowledge() {
        const today = new Date();
        const m = today.getMonth() + 1;
        const d = today.getDate();

        try {
            // Using AllOrigins Proxy to bypass security blocks (CORS)
            const wikiUrl = `https://en.wikipedia.org/api/rest_v1/feed/onthisday/all/${m}/${d}`;
            const response = await fetch(`https://api.allorigins.win/get?url=${encodeURIComponent(wikiUrl)}`);
            const json = await response.json();
            const data = JSON.parse(json.contents);

            const event = data.events[0];
            const scientist = data.births.find(b => b.text.toLowerCase().includes('scientist') || b.text.toLowerCase().includes('inventor') || b.text.toLowerCase().includes('physic')) || data.births[0];

            // Child-Friendly Explanations
            const content = [
                { 
                    cat: "Today's Great Hero (આજના મહાન વ્યક્તિ)", 
                    en: scientist.text, 
                    explain: "Imagine a person who used their brain like a special tool to build things that help everyone today. (એક એવી વ્યક્તિની કલ્પના કરો જેણે આજે દરેકને મદદ કરતી વસ્તુઓ બનાવવા માટે ખાસ સાધનની જેમ પોતાના મગજનો ઉપયોગ કર્યો.)" 
                },
                { 
                    cat: "Historical Milestone (ઐતિહાસિક ક્ષણ)", 
                    en: event.text, 
                    explain: "A long time ago, on this exact day, something very important happened that changed the world. (ઘણા સમય પહેલા, બરાબર આજના દિવસે, કંઈક એવું મહત્વનું બન્યું જેણે આખી દુનિયા બદલી નાખી.)" 
                }
            ];

            // Save Today's Fact for Tomorrow's Quiz
            const lastSavedDate = localStorage.getItem('gyan_save_date');
            if (lastSavedDate !== today.toDateString()) {
                localStorage.setItem('yesterday_fact', event.text);
                localStorage.setItem('gyan_save_date', today.toDateString());
            }

            render(content);
            setupQuiz();
        } catch (e) {
            // BACKUP: If Internet fails, show Technical/ECE Knowledge
            render([
                { cat: "Technical Wisdom", en: "A Diode is a one-way street for electricity.", explain: "Think of it like a valve that only lets water go forward, never backward. (તેને એક વાલ્વની જેમ વિચારો જે પાણીને ફક્ત આગળ જવા દે છે, ક્યારેય પાછળ નહીં.)" },
                { cat: "Science Logic", en: "Everything is made of tiny atoms.", explain: "Atoms are like tiny LEGO bricks that build everything in the world. (પરમાણુઓ એ નાના લેગો બ્લોક્સ જેવા છે જે દુનિયાની દરેક વસ્તુ બનાવે છે.)" }
            ]);
        }
    }

    async function render(items) {
        let html = "";
        for (let item of items) {
            // Pro Tip: We explain difficult things in brackets
            html += `<div class="card">
                <span class="category">${item.cat}</span>
                <div class="eng-view">
                    <p><b>Today's Fact:</b> ${item.en}</p>
                    <p><i><b>Explain (10yr old logic):</b> ${item.explain}</i></p>
                </div>
                <div class="guj-text">
                    <b>ગુજરાતીમાં સમજૂતી:</b><br>${item.explain}
                </div>
            </div>`;
        }
        document.getElementById('dailyContent').innerHTML = html;
    }

    function setupQuiz() {
        const yesterday = localStorage.getItem('yesterday_fact');
        const savedDate = localStorage.getItem('gyan_save_date');
        const today = new Date().toDateString();

        // Only show quiz if we have a fact from a PREVIOUS visit
        if (yesterday && localStorage.getItem('last_visit') !== today) {
            document.getElementById('yesterdayQuiz').style.display = 'block';
            document.getElementById('quizQuestion').innerText = "Do you remember the big event we talked about yesterday?";
            document.getElementById('quizAnswer').innerText = "Yesterday's Fact: " + yesterday;
        }
    }

    function toggleLanguage() {
        const gujs = document.querySelectorAll('.guj-text');
        const engs = document.querySelectorAll('.eng-view');
        const btn = document.getElementById('langBtn');
        const isHidden = gujs[0].style.display === 'none' || gujs[0].style.display === '';

        gujs.forEach(el => el.style.display = isHidden ? 'block' : 'none');
        engs.forEach(el => el.style.display = isHidden ? 'none' : 'block');
        btn.innerText = isHidden ? "Show English / અંગ્રેજી જુઓ" : "Translate to Gujarati / ગુજરાતી";
    }

    window.onload = () => {
        const user = localStorage.getItem('gyan_user');
        if(!user) {
            document.getElementById('login').style.display = 'flex';
        } else {
            document.getElementById('dispName').innerText = user;
            
            // Streak Management
            let streak = parseInt(localStorage.getItem('gyan_streak')) || 0;
            let lastVisit = localStorage.getItem('last_visit');
            let today = new Date().toDateString();
            
            if(lastVisit !== today) {
                streak++;
                localStorage.setItem('gyan_streak', streak);
                localStorage.setItem('last_visit', today);
            }
            document.getElementById('streakCount').innerText = streak;
            fetchKnowledge();
        }
    };
</script>
</body>
</html>
