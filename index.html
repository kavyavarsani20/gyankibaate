

<!DOCTYPE html>
<html lang="gu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jay Swaminarayan! | Gyankibaate</title>
    <style>
        :root { --primary: #e67e22; --dark: #2c3e50; --bg: #fdfefe; }
        body { font-family: 'Segoe UI', sans-serif; background: var(--bg); margin: 0; padding: 15px; line-height: 1.8; }
        .header { text-align: center; color: var(--primary); font-size: 2rem; font-weight: bold; margin: 20px 0; border-bottom: 3px double #eee; }
        .container { max-width: 800px; margin: auto; background: white; padding: 30px; border-radius: 25px; box-shadow: 0 10px 40px rgba(0,0,0,0.1); border-top: 10px solid var(--primary); }
        .date-display { text-align: center; font-weight: bold; color: #7f8c8d; margin-bottom: 10px; font-size: 1.1rem; }
        .streak-bar { display: flex; justify-content: space-between; background: #fff3e0; padding: 12px 25px; border-radius: 50px; margin-bottom: 25px; font-weight: bold; color: #e65100; border: 1px solid #ffe0b2; }
        .article { border-bottom: 1px solid #eee; padding: 20px 0; margin-bottom: 20px; }
        .cat-tag { background: var(--dark); color: white; padding: 4px 12px; border-radius: 5px; font-size: 0.8rem; font-weight: bold; text-transform: uppercase; }
        h2 { color: var(--dark); margin: 15px 0; font-size: 1.6rem; }
        .content-box { font-size: 1.15rem; color: #444; text-align: justify; }
        .guj-box { display: none; background: #f0f7ff; padding: 20px; border-radius: 15px; margin-top: 15px; border-left: 8px solid #3498db; font-size: 1.3rem; color: #1a237e; }
        .btn-main { background: var(--primary); color: white; border: none; width: 100%; padding: 18px; border-radius: 15px; font-size: 1.2rem; font-weight: bold; cursor: pointer; margin-bottom: 20px; transition: 0.3s; }
        .btn-main:hover { background: #d35400; }
        .quiz-section { background: #e8f5e9; padding: 20px; border-radius: 15px; border: 2px dashed #27ae60; display: none; margin-bottom: 20px; }
        .overlay { position: fixed; inset: 0; background: var(--dark); color: white; display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 1000; }
        input { padding: 15px; width: 280px; border-radius: 10px; border: none; font-size: 1.1rem; margin: 20px 0; text-align: center; }
    </style>
</head>
<body>

<div id="login" class="overlay" style="display:none;">
    <h1>Jay Swaminarayan!</h1>
    <p>Welcome to Gyankibaate. Enter your name:</p>
    <input type="text" id="nameIn" placeholder="Your Name / તમારું નામ">
    <button onclick="saveName()" class="btn-main" style="width:200px;">Enter</button>
</div>

<div class="header">Jay Swaminarayan!</div>

<div class="container" id="app">
    <div class="date-display" id="todayDate"></div>
    <div class="streak-bar">
        <span>Hello, <span id="userName"></span>!</span>
        <span>🔥 Streak: <span id="streakNum">0</span> Days</span>
    </div>

    <button class="btn-main" onclick="toggleGuj()">Switch Language / ગુજરાતીમાં જુઓ</button>

    <div id="quizArea" class="quiz-section">
        <span class="cat-tag">Previous Quiz</span>
        <p id="qText">Loading yesterday's memory...</p>
        <button onclick="document.getElementById('aText').style.display='block'" style="background:none; border: 1px solid #27ae60; color:#27ae60; cursor:pointer; border-radius:5px; padding:5px 10px;">Show Answer</button>
        <p id="aText" style="display:none; font-weight:bold; margin-top:10px;"></p>
    </div>

    <div id="factContainer">
        <p style="text-align:center;">Opening today's wisdom... Please wait.</p>
    </div>
</div>

<script>
    const user = localStorage.getItem('gyan_user');
    
    function saveName() {
        const n = document.getElementById('nameIn').value;
        if(n) { localStorage.setItem('gyan_user', n); location.reload(); }
    }

    async function init() {
        if(!user) { document.getElementById('login').style.display = 'flex'; return; }
        document.getElementById('userName').innerText = user;

        const now = new Date();
        document.getElementById('todayDate').innerText = now.toDateString();

        // Streak & Quiz Logic
        let streak = parseInt(localStorage.getItem('gyan_streak')) || 0;
        let last = localStorage.getItem('gyan_last');
        let today = now.toDateString();
        
        if(last !== today) {
            streak++;
            localStorage.setItem('gyan_streak', streak);
            localStorage.setItem('gyan_last', today);
        }
        document.getElementById('streakNum').innerText = streak;

        // Fetching 365-Day Content
        try {
            const response = await fetch('facts.json');
            const library = await response.json();
            
            // Get day of year (0-365)
            const start = new Date(now.getFullYear(), 0, 0);
            const diff = now - start;
            const dayIdx = Math.floor(diff / 86400000).toString();

            const todayData = library[dayIdx] || library["1"]; // Fallback to day 1

            // Display Content
            let html = "";
            todayData.articles.forEach(art => {
                html += `
                <div class="article">
                    <span class="cat-tag">${art.category}</span>
                    <h2>${art.title}</h2>
                    <div class="content-box">${art.eng}</div>
                    <div class="guj-box">${art.guj}</div>
                </div>`;
            });
            document.getElementById('factContainer').innerHTML = html;

            // Quiz Logic (Show yesterday's info)
            if(last !== today && localStorage.getItem('prev_title')) {
                document.getElementById('quizArea').style.display = 'block';
                document.getElementById('qText').innerText = "Yesterday we learned about: " + localStorage.getItem('prev_title');
                document.getElementById('aText').innerText = "Answer: " + localStorage.getItem('prev_summary');
            }
            
            // Save today for tomorrow's quiz
            localStorage.setItem('prev_title', todayData.articles[0].title);
            localStorage.setItem('prev_summary', todayData.articles[0].category);

        } catch(e) {
            document.getElementById('factContainer').innerHTML = "Error loading facts. Ensure facts.json is in your repo!";
        }
    }

    function toggleGuj() {
        const boxes = document.querySelectorAll('.guj-box');
        const isHidden = boxes[0].style.display === 'none' || boxes[0].style.display === '';
        boxes.forEach(b => b.style.display = isHidden ? 'block' : 'none');
    }

    init();
</script>
</body>
</html>
